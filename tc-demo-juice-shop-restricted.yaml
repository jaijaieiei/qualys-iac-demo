AWSTemplateFormatVersion: "2010-09-09"
Description: OWASP Juice Shop demo on EC2 with inbound access restricted to one public IP CIDR.

Parameters:
  DemoName:
    Type: String
    Default: qualys-juice-shop
    Description: Lowercase prefix for demo resource names.
    AllowedPattern: "^[a-z][a-z0-9-]{2,40}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select your default VPC.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Select a public subnet in the selected VPC.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    Description: t3.micro/t2.micro is enough for a short demo. Use t3.small only if Docker startup is slow.
  AllowedHttpCidr:
    Type: String
    Default: 140.82.194.225/32
    Description: Your current public IP in CIDR format. Only this CIDR can access Juice Shop HTTP port 3000.
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}\\/[0-9]{1,2})$"
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  JuiceShopRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DemoName}-ssm-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Purpose
          Value: QualysJuiceShopDemo

  JuiceShopInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${DemoName}-instance-profile"
      Roles:
        - !Ref JuiceShopRole

  JuiceShopSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OWASP Juice Shop demo - HTTP restricted to one CIDR, no SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Juice Shop HTTP restricted to current demo IP
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - Description: Allow outbound internet for SSM and Docker image pull
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${DemoName}-sg"
        - Key: Purpose
          Value: QualysJuiceShopDemo

  JuiceShopInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref JuiceShopInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref JuiceShopSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${DemoName}-ec2"
        - Key: Purpose
          Value: QualysJuiceShopDemo
        - Key: QualysDemoModule
          Value: WAS-CWP-KCS
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y || true
          dnf install -y docker jq || true
          systemctl enable --now amazon-ssm-agent || true
          systemctl enable --now docker
          usermod -aG docker ec2-user || true
          docker rm -f juice-shop || true
          docker pull bkimminich/juice-shop:latest
          docker run -d --restart unless-stopped --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref JuiceShopInstance
  PublicIp:
    Description: Public IP of the Juice Shop EC2 instance.
    Value: !GetAtt JuiceShopInstance.PublicIp
  JuiceShopUrl:
    Description: Open this URL only from the allowed public IP.
    Value: !Sub "http://${JuiceShopInstance.PublicIp}:3000"
  AllowedHttpCidr:
    Description: CIDR allowed to access Juice Shop.
    Value: !Ref AllowedHttpCidr
  SsmConnectHint:
    Description: Use Session Manager for shell access. SSH is not open.
    Value: !Sub "AWS Systems Manager > Session Manager > Start session > ${JuiceShopInstance}"
